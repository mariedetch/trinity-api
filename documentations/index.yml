openapi: '3.0.3'
info:
  title: Trinity API documentation
  description: >
    Bienvenue dans la documentation API de Trinity,
    une application de gestion de stock conçue pour
    offrir une expérience fluide et intuitive
    aux gérants et aux clients.
    Cette API permet de gérer efficacement les stocks,
    les commandes, et les interactions entre les
    utilisateurs des deux plateformes (web et mobile).
  version: '1.0'
servers:
  - url: https://localhost:3000/api/v1

paths:
  /auth/login:
    post:
      summary: "User login"
      description: "Logs in a user by validating their credentials and returns an access token."
      operationId: "loginUser"
      tags:
        - Auth
      requestBody:
        $ref: "#/components/requestBodies/LoginRequest"
      responses:
        '200':
          description: "Successful login"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: "Unauthorized – Authentication failed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                application/json:
                  value:
                    success: false
                    status: "UNAUTHORIZED"
                    code: -401
                    message: "Authentication failed. Invalid credentials."
                    error: "User authentication failed due to invalid email or password."
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/schemas/BaseHeaders/properties/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/schemas/BaseHeaders/properties/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/schemas/BaseHeaders/properties/X-RateLimit-Reset'
        '422':
          description: "Unprocessable Entity – Validation errors"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                status: "INVALID_CREDENTIALS"
                code: -1000
                message: "Validation error occurred."
                errors: {
                  email: [
                    "The email is required",
                    "The email should be ..."
                  ],
                  password: [
                    "The password is required",
                    "The password should be ..."
                  ]
                }
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/schemas/BaseHeaders/properties/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/schemas/BaseHeaders/properties/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/schemas/BaseHeaders/properties/X-RateLimit-Reset'
        '500':
          $ref: "#/components/responses/InternalServerError"
  /auth/logout:
    post:
      summary: "User logout"
      description: "Logs out a user by invalidating their current session or access token."
      operationId: "logoutUser"
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Successful logout"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              example:
                success: true
                status: 'OK'
                code: 2000
                message: "User has been successfully logged out."
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh-token:
    post:
      summary: "Refresh Access Token"
      description: "Generates a new access token using a valid refresh token."
      tags:
        - Auth
      operationId: "refreshToken"
      security:
        - BearerAuth: []
      requestBody:
        description: "Refresh token required to generate a new access token."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: "The refresh token provided during login."
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
      responses:
        '200':
          description: "Successful token refresh"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/user:
    get:
      summary: "Fetch Authenticated User"
      description: "Retrieves the details of the currently authenticated user."
      operationId: "getAuthenticatedUser"
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Successful retrieval of user details"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/profile:
    get:
      summary: "Get User Profile"
      description: "Retrieve the profile information of the currently authenticated user."
      operationId: "getUserProfile"
      tags:
        - User Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Successfully retrieved user profile"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: "Update User Profile"
      description: "Update the profile information of the currently authenticated user."
      operationId: "updateUserProfile"
      tags:
        - User Profile
      security:
        - BearerAuth: []
      requestBody:
        description: "Profile fields to be updated"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      responses:
        '200':
          description: "Successfully updated user profile"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        '422':
          description: "Unprocessable Entity – Validation errors"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                status: "INVALID_CREDENTIALS"
                code: -1000
                message: "Validation error occurred."
                errors: {
                  firstname: [
                    "The firstname is required",
                    "The firstname should be ..."
                  ],
                }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/profile/update-password:
    put:
      summary: "Update Password"
      description: "Allows the authenticated user to update their account password."
      operationId: "updateUserPassword"
      tags:
        - User Profile
      security:
        - BearerAuth: []
      requestBody:
        description: "Current and new password details."
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: "Password updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
              example:
                success: true
                status: 'OK'
                code: 2000
                message: "Password updated successfully."
                data: {}
        '400':
          description: "Bad Request – Invalid input (e.g., incorrect current password or weak new password)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                status: "INVALID_CREDENTIALS"
                code: -1000
                message: "Validation error occurred."
                errors: {
                  current_password: [
                    "The current_password is required",
                    "The current_password should be ..."
                  ],
                }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/profile/addresses:
    get:
      summary: "Get User Addresses"
      description: "Retrieve the list of addresses associated with the authenticated user."
      operationId: "getUserAddresses"
      tags:
        - User Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Successfully updated user profile"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - type: object
                              properties:
                                id:
                                  $ref: '#/components/schemas/BaseId'
                            - $ref: "#/components/schemas/Address"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: "Add a New Address"
      description: "Allows the authenticated user to add a new address to their profile."
      operationId: "addUserAddress"
      tags:
        - User Profile
      security:
        - BearerAuth: []
      requestBody:
        description: "Details of the new address."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Address"
      responses:
        '201':
          description: "Address successfully added."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - type: object
                            properties:
                              id:
                                $ref: '#/components/schemas/BaseId'
                          - $ref: "#/components/schemas/Address"
        '422':
          description: "Unprocessable Entity – Validation errors"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                status: "INVALID_CREDENTIALS"
                code: -1000
                message: "Validation error occurred."
                errors: {
                  country: [
                    "The country is required",
                    "The country should be ..."
                  ],
                }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/profile/addresses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: "The unique identifier of the address."
        schema:
          $ref: "#/components/schemas/BaseId"

    put:
      summary: "Update an Address"
      description: "Allows the authenticated user to update an existing address by ID."
      operationId: "updateUserAddress"
      tags:
        - User Profile
      security:
        - BearerAuth: []
      requestBody:
        description: "Updated address details."
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: "Address updated successfully."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - type: object
                            properties:
                              id:
                                $ref: '#/components/schemas/BaseId'
                          - $ref: "#/components/schemas/Address"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: "Unprocessable Entity – Validation errors"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                status: "INVALID_CREDENTIALS"
                code: -1000
                message: "Validation error occurred."
                errors: {
                  country: [
                    "The country is required",
                    "The country should be ..."
                  ],
                }
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: "Delete a an Address"
      description: "Allows the authenticated user to delete an existing address by ID."
      tags:
        - User Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Address deleted successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              example:
                success: true
                status: 'OK'
                code: 2000
                message: "Address deleted successfully."
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/profile/payment-methods:
    get:
      summary: "Get User Payment Methods"
      description: "Retrieve the list of payment methods associated with the authenticated user."
      operationId: "getUserPaymentMethods"
      tags:
        - User Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "List of user payment methods."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - type: object
                              properties:
                                id:
                                  $ref: '#/components/schemas/BaseId'
                            - $ref: "#/components/schemas/PaymentMethod"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: "Add a New Payment Method"
      description: "Allows the authenticated user to add a new payment method to their profile."
      operationId: "addUserPaymentMethod"
      tags:
        - User Profile
      security:
        - BearerAuth: []
      requestBody:
        description: "Details of the new payment method."
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethod'
      responses:
        '201':
          description: "Payment method successfully added."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: "Indicates if the request was successful."
                    example: true
                  message:
                    type: string
                    description: "Success message."
                    example: "Payment method added successfully."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: "Unprocessable Entity – Validation errors"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                status: "INVALID_CREDENTIALS"
                code: -1000
                message: "Validation error occurred."
                errors: {
                  card_number: [
                    "The card_number is required",
                    "The card_number should be ..."
                  ],
                }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/profile/payment-methods/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: "The unique identifier of the payment method."
        schema:
          $ref: "#/components/schemas/BaseId"

    put:
      summary: "Update a Payment Method"
      description: "Allows the authenticated user to update an existing payment method by ID."
      operationId: "updateUserPaymentMethod"
      tags:
        - User Profile
      security:
        - BearerAuth: []
      requestBody:
        description: "Updated payment method details."
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethod'
      responses:
        '200':
          description: "Payment method updated successfully."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: "Indicates if the request was successful."
                    example: true
                  message:
                    type: string
                    description: "Success message."
                    example: "Payment method updated successfully."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: "Unprocessable Entity – Validation errors"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                status: "INVALID_CREDENTIALS"
                code: -1000
                message: "Validation error occurred."
                errors: {
                  card_number: [
                    "The card_number is required",
                    "The card_number should be ..."
                  ],
                }
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: "Delete a Payment Method"
      description: "Allows the authenticated user to delete an existing payment method by ID."
      operationId: "deleteUserPaymentMethod"
      tags:
        - User Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Payment method deleted successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              example:
                success: true
                status: 'OK'
                code: 2000
                message: "Payment method deleted successfully."
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/customers:
    get:
      summary: "Get Paginated List of Customers"
      description: "Retrieve a paginated list of customers with query parameters for pagination."
      operationId: "getPaginatedCustomers"
      tags:
        - Customers
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        '200':
          description: "Successful response with paginated customers."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                          allOf:
                            - $ref: '#/components/schemas/PaginationResource'
                            - type: object
                              properties:
                                items:
                                  $ref: "#/components/schemas/User"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/customers/{id}:
    get:
      summary: "Get Customer by ID"
      description: "Retrieve detailed information about a specific customer."
      operationId: "getCustomerById"
      tags:
        - Customers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "The unique identifier of the customer."
          schema:
            $ref: "#/components/schemas/BaseId"
      responses:
        '200':
          description: "Successful response with customer details."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /products:
    get:
      summary: "Get Paginated List of Products"
      description: "Retrieve a paginated list of products."
      operationId: "getPaginatedProducts"
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - name: keyword
          in: query
          description: "Search for products by name or description."
          required: false
          schema:
            type: string
            example: "milk"
        - name: min_price
          in: query
          description: "Filter products with a minimum selling price."
          required: false
          schema:
            type: number
            format: float
            example: 10.00
        - name: max_price
          in: query
          description: "Filter products with a maximum selling price."
          required: false
          schema:
            type: number
            format: float
            example: 100.00
        - name: stock_status
          in: query
          description: |
            Filter products based on stock status:
            - `out_of_stock`: Products with zero stock.
            - `low_stock`: Products with low stock levels.
          required: false
          schema:
            type: string
            enum: [out_of_stock, low_stock]
            example: "out_of_stock"
      responses:
        '200':
          description: "Successful response with paginated products."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PaginationResource"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/Product"
        '400':
          $ref: "#/components/responses/BadRequest"
        '500':
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: "Create a New Product"
      description: "Create a new product by providing the necessary details."
      operationId: "createProduct"
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProduct"
      responses:
        '201':
          description: "Product created successfully."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
        '400':
          $ref: "#/components/responses/BadRequest"
        '422':
          description: "Unprocessable Entity – Validation errors"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                status: "INVALID_CREDENTIALS"
                code: -1000
                message: "Validation error occurred."
                errors: {
                  name: [
                    "The name is required",
                    "The name should be ..."
                  ],
                }
        '500':
          $ref: "#/components/responses/InternalServerError"
  /products/g/stats:
    get:
      summary: Get the statistics about Products
      description: Retreive the statistics about product
      operationId: "getProductsStats"
      tags:
        - Products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Successful response with product's statistics."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProductStats"
        '400':
          $ref: "#/components/responses/BadRequest"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      summary: "Get Product by ID"
      description: "Retrieve detailed information about a specific product."
      operationId: "getProductById"
      tags:
        - Products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Successful response with product details."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: "Update Product by ID"
      description: "Update details of an existing product."
      operationId: "updateProduct"
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProduct"
      responses:
        '200':
          description: "Product updated successfully."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '422':
          description: "Unprocessable Entity – Validation errors"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                status: "INVALID_CREDENTIALS"
                code: -1000
                message: "Validation error occurred."
                errors: {
                  name: [
                    "The name is required",
                    "The name should be ..."
                  ],
                }
        '500':
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: "Delete Product by ID"
      description: "Delete a product by its unique identifier."
      operationId: "deleteProductById"
      tags:
        - Products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "Product deleted successfully."
          content:
            application/json:
              schema:
