components:
  schemas:
    BaseHeaders:
      type: object
      properties:
        X-RateLimit-Limit:
          type: integer
          description: "The maximum number of requests allowed in the current window."
        X-RateLimit-Remaining:
          type: integer
          description: "The number of requests remaining in the current window."
        X-RateLimit-Reset:
          type: integer
          description: "The time when the rate limit will reset, in UTC epoch seconds."
    BaseId:
      type: string
      format: uuid
      description: "A unique identifier in UUID format."
      example: "123e4567-e89b-12d3-a456-426614174000"
    UserRole:
      type: string
      description: "Defines the role of a user in the system."
      enum:
        - MANAGER
        - CUSTOMER
      example: "MANAGER"
    CommandStatus:
      type: string
      description: Defines the different states that a command can be throug
      enum:
        - CREATED
        - PAID
        - IN_PROGRESSS
        - SHIPPED
        - DELIVERED
        - CANCELLED
        - RETURNED
        - REFUNDED*
      default: CREATED
      example: CREATED
    PaymentStatus:
      type: string
      description: Defines the different states that a payment can be
      enum:
        - INITIATED
        - APPROVED
        - COMPLETED
        - FAILED
        - CANCELLED
        - REFUNDED
    Address:
      type: object
      properties:
        country:
          type: string
          example: "Bénin"
        city:
          type: string
          example: "Cotonou"
        state:
          type: string
          example: "Littoral"
        postal_code:
          type: string
          example: "BP270"
        phone:
          type: string
          example: "2290167156863"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
    PaymentMethod:
      type: object
      properties:
        card_number:
          type: string
          description: "The credit card number."
          example: "4111111111111111"
          minLength: 13
          maxLength: 19
        expiry_date:
          type: string
          description: "The expiration date of the card in MM/YY format."
          example: "12/26"
          pattern: "^(0[1-9]|1[0-2])/[0-9]{2}$"
        holder_name:
          type: string
          description: "The name of the cardholder as printed on the card."
          example: "John Doe"
          minLength: 3
          maxLength: 50
        security_code:
          type: string
          description: "The card's CVV or CVC security code."
          example: "123"
          minLength: 3
          maxLength: 4
    User:
      type: object
      required:
        - id
        - firstname
        - lastname
        - phonenumber
        - email
        - role
      properties:
        id:
          $ref: '#/components/schemas/BaseId'
        firstname:
          type: string
          example: "John"
        lastname:
          type: string
          example: "Doe"
        phonenumber:
          type: string
          example: "2290167266867"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        address:
          $ref: "#/components/schemas/Address"
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        role:
          $ref: "#/components/schemas/UserRole"
    UserProfileUpdateRequest:
      type: object
      properties:
        firstname:
          $ref: "#/components/schemas/User/properties/firstname"
        lastname:
          $ref: "#/components/schemas/User/properties/lastname"
        phonenumber:
          $ref: "#/components/schemas/User/properties/phonenumber"
        address:
          $ref: "#/components/schemas/User/properties/address"
        payment_method:
          $ref: "#/components/schemas/User/properties/payment_method"
    UpdatePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          description: "The user's current password."
          example: "oldPassword123"
        new_password:
          type: string
          description: "The new password that the user wants to set."
          example: "NewStrongPassword456"
        confirm_password:
          type: string
          description: "Confirmation of the new password for validation."
          example: "NewStrongPassword456"
      required:
        - current_password
        - new_password
        - confirm_password
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: "Indicates whether the request was successful (true) or failed (false)."
        status:
          type: string
          description: "Custom status of the system, e.g., 'OK'."
        code:
          type: integer
          description: "Code associated with the status, positive for success and negative for failure. Example: 0909 for success, -1002 for failure."
        message:
          type: string
          description: "Message detailing the result of the request."
        data:
          type: object
          description: "The data of the response. Can be null if no data is returned."
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          description: "Indicates whether the request was successful (true) or failed (false)."
        status:
          type: string
          description: "Custom status of the system, e.g., 'INVALID_REQUEST'."
        code:
          type: integer
          description: "Code associated with the status"
        message:
          type: string
          description: "Message detailing the result of the request."
        error:
          type: object
          description: "Additional error details if the status is a failure. Contains error code and explanation."
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          description: "Indicates whether the request was successful (true) or failed (false)."
        status:
          type: string
          description: "Custom status of the system, e.g., 'INVALID_REQUEST'."
        code:
          type: integer
          description: "Code associated with the status"
        message:
          type: string
          description: "Message detailing the result of the request."
        errors:
          type: array
          items:
            type: array
            description: "The field that caused the validation failure."
            items:
              type: string
              description: "The error message describing the validation failure for the field."
          description: "An array of validation errors, detailing which fields failed validation and why."
    PaginationResource:
      type: object
      properties:
        current_page:
          type: integer
          description: "The current page number being viewed."
          example: 1
        per_page:
          type: integer
          description: "The number of items displayed per page."
          example: 10
        total:
          type: integer
          description: "The total number of items across all pages."
          example: 100
        items:
          type: array
          description: "The list of items on the current page."
          items:
            type: object
            description: "A generic object representing an item. Replace this with a specific schema reference for your use case."
      required:
        - current_page
        - per_page
        - total
        - items
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
          description: "The email address of the user."
        password:
          type: string
          example: "password123"
          minLength: 0
          description: "The password for the user."
      required:
        - email
        - password
    LoginResponse:
      type: object
      allOf:
        - $ref: "#components/schemas/BaseResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJp...."
                  description: "The JWT access token issued after a successful login."
                refresh_token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJp...."
                  description: "The JWT refresh token issued after a successful login."
                token_type:
                  type: string
                  enum:
                    - bearer
                  example: "bearer"
                  description: "The type of the token, typically 'bearer'."
                expire_in:
                  type: integer
                  example: 3600
                  description: "The expiration time of the access token in seconds."
                user:
                  $ref: "#/components/schemas/User"
                  description: "Information about the logged-in user."
              required:
                - access_token
                - token_type
                - expire_in
                - user
    Product:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/BaseId"
        correlation_id:
          type: number
          description: "Unique identifier that links this product to the Open Food Facts API."
          example: "0737628064502"
        slug:
          type: string
          description: "A URL-friendly version of the product name, typically used in URLs."
          example: "organic-apple"
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        category:
          type: string
          description: "The product's category (e.g., fruit, beverage)."
          example: "Fruit"
        name:
          type: string
          description: "Name of the product."
          example: "Organic Apple"
        description:
          type: string
          description: "A detailed description of the product."
          example: "Fresh organic apples grown without pesticides."
        nutrients:
          type: array
          items:
            type: string
          description: "Nutrient information of the product. A list of key-value pairs."
          example: ["Calories: 52 kcal", "Fat: 0.2g", "Carbohydrates: 14g"]
        ingredients:
          type: array
          items:
            type: string
          description: "List of ingredients contained in the product."
          example: ["Organic apples", "Water"]
        initial_cost:
          type: number
          format: float
          description: "The cost price of the product when it was acquired."
          example: 1.50
        selling_price:
          type: number
          format: float
          description: "The price at which the product is sold to customers."
          example: 2.99
        quantity:
          type: integer
          description: "The number of units available in stock."
          example: 100
        picture:
          type: string
          description: "URL for the product image."
          example: "https://example.com/images/organic-apple.jpg"
    CreateProduct:
      type: object
      properties:
        correlation_id:
          $ref: "#/components/schemas/Product/properties/correlation_id"
        category:
          $ref: "#/components/schemas/Product/properties/category"
        name:
          $ref: "#/components/schemas/Product/properties/name"
        description:
          $ref: "#/components/schemas/Product/properties/description"
        nutrients:
          $ref: "#/components/schemas/Product/properties/nutrients"
        ingredients:
          $ref: "#/components/schemas/Product/properties/ingredients"
        initial_cost:
          $ref: "#/components/schemas/Product/properties/initial_cost"
        selling_price:
          $ref: "#/components/schemas/Product/properties/selling_price"
        quantity:
          $ref: "#/components/schemas/Product/properties/quantity"
        picture:
          $ref: "#/components/schemas/Product/properties/picture"
      required:
        - correlation_id
        - category
        - name
        - description
        - nutrients
        - ingredients
        - initial_cost
        - selling_price
        - quantity
        - picture
    UpdateProduct:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/Product/properties/category"
        name:
          $ref: "#/components/schemas/Product/properties/name"
        description:
          $ref: "#/components/schemas/Product/properties/description"
        initial_cost:
          $ref: "#/components/schemas/Product/properties/initial_cost"
        selling_price:
          $ref: "#/components/schemas/Product/properties/selling_price"
    ProductStats:
      type: object
      properties:
        total_product:
          type: number
          description: The total number of product
          example: 256
        available_products:
          type: number
          description: The total number of available product
          example: 121
        products_out_of_stock:
          type: number
          description: The total number of product that out of stock
          example: 10
        soon_to_be_out_of_stock:
          type: number
          description: The total number of product that are going to be out of stock
          example: 125
    PriceItem:
      type: object
      properties:
        initial_cost:
          $ref: "#/components/schemas/Product/properties/initial_cost"
        selling_price:
          $ref: "#/components/schemas/Product/properties/selling_price"
        start_date:
          type: string
          format: datetime
          description: "The start date when the price change became effective."
          example: "2023-01-01T00:00:00Z"
        end_date:
          type: string
          format: datetime
          description: "The end date when the price change was no longer applicable."
          example: "2023-12-31T23:59:59Z"
      required:
        - initial_cost
        - selling_price
        - start_date
    OrderItem:
      type: object
      properties:
        customer:
          type: string
          description: "The name or ID of the customer associated with the order item."
          example: "john_doe"
        created_at:
          type: string
          format: datetime
          description: "The timestamp when the order item was created."
          example: "2024-01-01T12:00:00Z"
        quantity:
          type: integer
          description: "The quantity of items in the order."
          example: 3
        status:
          type: string
          description: "The status of the order item (e.g., 'pending', 'shipped', 'delivered')."
          example: "pending"
      required:
        - customer
        - created_at
        - quantity
        - status
    SupplyItem:
      type: object
      properties:
        created_at:
          type: string
          format: datetime
          description: "The timestamp when the supply item was created."
          example: "2024-01-01T12:00:00Z"
        quantity:
          type: integer
          description: "The current quantity of the supply item."
          example: 100
        old_quantity:
          type: integer
          description: "The previous quantity before the change."
          example: 80
        new_quantity:
          type: integer
          description: "The new quantity after the change."
          example: 120
      required:
        - created_at
        - quantity
        - old_quantity
        - new_quantity
    CartProductItem:
      type: object
      description: Represent a unique product in the cart
      properties:
        id:
          $ref: "#/components/schemas/BaseId"
        name:
          $ref: "#/components/schemas/Product/properties/name"
        picture:
          $ref: "#/components/schemas/Product/properties/picture"
    CartItem:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/BaseId"
        product:
          $ref: "#/components/schemas/CartProductItem"
        quantity:
          description: The quantity of the product in the cart
          type: number
          example: 4
    CustomerItem:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/BaseId"
        firstname:
          $ref: "#/components/schemas/User/properties/firstname"
        lastname:
          $ref: "#/components/schemas/User/properties/lastname"
        phonenumber:
          $ref: "#/components/schemas/User/properties/phonenumber"
        email:
          $ref: "#/components/schemas/User/properties/email"
    CommandMetaData:
      type: object
      properties:
        paid_at:
          type: string
          format: datetime
          description: "The date that user paid the command."
          example: "2023-12-31T23:59:59Z"
        validated_at:
          type: string
          format: datetime
          description: "The date that the command is validated by the store manager."
          example: "2023-12-31T23:59:59Z"
        shipped_at:
          type: string
          format: datetime
          description: "The date the command is shipped"
          example: "2023-12-31T23:59:59Z"
        delivered_at:
          type: string
          format: datetime
          description: "The date that the command is received by the customer"
          example: "2023-12-31T23:59:59Z"
    Command:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/BaseId"
        reference:
          type: string
          description: The unique reference of the command
        customer:
          description: Represent the user that oder the command, only present for manager
          $ref: "#/components/schemas/CustomerItem"
        total_price_incl:
          type: number
          format: double
          description: Total price of product in the command taxe includ
        total_price_excl:
          type: number
          format: double
          description: Total price of product in the command taxe exclud
        shipping_charge:
          type: number
          format: double
          description: Total price of the command taxe includ
        meta_data:
          $ref: "#/components/schemas/CommandMetaData"
        shipping_address:
          $ref: "#/components/schemas/Address"
        status:
          $ref: "#/components/schemas/CommandStatus"
    CommandStats:
      type: object
      properties:
        total_commands:
          type: integer
          example: 145
          description: Total ordered command
        waiting_commands:
          type: integer
          example: 15
          description: Total command waiting for admin approval
        shipped_commands:
          type: integer
          example: 15
          description: Total command that are shipped
        delivered_commands:
          type: integer
          example: 15
          description: Total command that are delivered
    PaiementItem:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/BaseId"
        reference:
          type: string
          description: The unique paiement reference
        external_id:
          type: string
          description: The unique transaction id from the external provider
        amount:
          type: number
          format: double
          description: The amount paid
        status:
          $ref: "#/components/schemas/PaymentStatus"
        meta_data:
          type: object
          properties:
            approved_at:
              type: string
              format: datetime
              description: "The timestamp when the payment was approved"
              example: "2024-01-01T12:00:00Z"
            completed_at:
              type: string
              format: datetime
              description: "The timestamp when the payment was completed"
              example: "2024-01-01T12:00:00Z"
            failed_at:
              type: string
              format: datetime
              description: "The timestamp when the payment was failed"
              example: "2024-01-01T12:00:00Z"
            cancelled_at:
              type: string
              format: datetime
              description: "The timestamp when the payment was cancelled"
              example: "2024-01-01T12:00:00Z"
            refunded_at:
              type: string
              format: datetime
              description: "The timestamp when the payment was refunded"
              example: "2024-01-01T12:00:00Z"
        created_at:
          type: string
          format: datetime
          description: "The timestamp when the payment was initiated."
          example: "2024-01-01T12:00:00Z"
    CommandProductItem:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/BaseId"
        product:
          $ref: "#/components/schemas/Product"
        quantity:
          type: integer
          description: "The number of product to command."
          example: 100
        unit_price_incl:
          type: number
          format: double
          description: Unitary price of the product taxe includ
        unit_price_excl:
          type: number
          format: double
          description: Unitary price of the product taxe exclud
        total_price_incl:
          type: number
          format: double
          description: Total price of the product taxe includ
        total_price_excl:
          type: number
          format: double
          description: Total price of the product taxe exclud

  responses:
    BadRequest:
      description: "The request was invalid due to incorrect parameters."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            application/json:
              value:
                success: false
                status: "INVALID_PARAMS"
                code: -400
                message: "The request was invalid due to incorrect parameters."
                error: "The 'email' field is required and cannot be empty."
    Unauthorized:
      description: "Authentication failed or missing."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            application/json:
              value:
                success: false
                status: "MISSING_TOKEN"
                code: -401
                message: "Authentication failed or missing."
                error: "Please provide a valid token in the Authorization header."
    Forbidden:
      description: "You do not have permission to access this resource."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            application/json:
              value:
                success: false
                status: "ACCESS_DENIED"
                code: -403
                message: "You do not have permission to access this resource."
                error: "You are not authorized to perform this action."
    NotFound:
      description: "The requested resource could not be found."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            application/json:
              value:
                success: false
                status: "RESOURCE_NOT_FOUND"
                code: -404
                message: "The requested resource could not be found."
                error: "The requested user could not be found."
    InternalServerError:
      description: "The server encountered an unexpected condition that prevented it from fulfilling the request."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            application/json:
              value:
                success: false
                status: "SERVER_CRASH"
                code: -500
                message: "The server encountered an unexpected condition."
                error: "The database connection failed unexpectedly."
  parameters:
    page:
      name: page
      in: query
      description: "The page number to retrieve."
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    perPage:
      name: per_page
      in: query
      description: "The number of items to retrieve per page."
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
    productId:
      name: id
      in: path
      description: "The ID of the product to retrieve price history for."
      required: true
      schema:
          $ref: "#/components/schemas/BaseId"
    cartItemId:
      name: id
      in: path
      description: "The ID of the item in the cart."
      required: true
      schema:
          $ref: "#/components/schemas/BaseId"
    commandId:
      name: id
      in: path
      description: "The ID of the command to retrieve price history for."
      required: true
      schema:
          $ref: "#/components/schemas/BaseId"
  requestBodies:
    LoginRequest:
      description: "Login credentials required to authenticate the user."
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
