version: '3.8'

services:
  api:
    image: ${IMAGE_NAME}
    restart: always
    container_name: trinity-api
    volumes:
      - .:/usr/src/app
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - trinity-network

  db:
    image: postgres:15
    restart: unless-stopped
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trinity-network

networks:
  trinity-network:
    driver: bridge

volumes:
  postgres_data:
