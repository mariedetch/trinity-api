stages:
  - setup
  - validation
  - test
  - build
  - deploy

variables:
  DEV_IMAGE: "$ECR_URI:dev"
  PROD_IMAGE: "$ECR_URI:$CI_COMMIT_TAG"

default:
  tags:
    - backend
  image: node:20

build:
  stage: build
  before_script:
    - ./deployment/application/download-secure-files.sh
    - cp .secure_files/env.$ENVIRONMENT .env
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URI
  script:
    - echo "Compilation et construction de l'image docker"
    - docker build -t $IMAGE_NAME .
    - docker tag $IMAGE_NAME $TARGET_IMAGE
    - docker push $TARGET_IMAGE
  after_script:
    - echo "Nettoyage des ressources après la construction de l'image Docker"
    - docker system prune -af --volumes
    - rm -rf .secure_files/ && rm -rf .env
  tags:
    - shell-executor
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
      variables:
        ENVIRONMENT: "dev"
        TARGET_IMAGE: $DEV_IMAGE
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always
      variables:
        ENVIRONMENT: "prod"
        TARGET_IMAGE: $PROD_IMAGE
    - when: never

deploy:
  stage: deploy
  before_script:
    - ./deployment/application/download-secure-files.sh
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_PUBLIC_IP >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
    - chmod 600 .secure_files/$DEPLOY_KEY
  script:
    - ./deployment/application/$DEPLOY_SCRIPT
  after_script:
    - echo "Nettoyage des clés SSH et fichiers de secrets"
    - rm -rf ~/.ssh/
    - rm -rf .secure_files/
  tags:
    - shell-executor
  environment:
    name: $ENVIRONMENT_NAME
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
      variables:
        ENVIRONMENT_NAME: "Dev"
        DEPLOY_KEY: "trinity-dev-key-pair.pem"
        DEPLOY_SCRIPT: "deploy-dev.sh"
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always
      variables:
        ENVIRONMENT_NAME: "Prod"
        DEPLOY_KEY: "trinity-prod-key-pair.pem"
        DEPLOY_SCRIPT: "deploy-prod.sh"
    - when: never
