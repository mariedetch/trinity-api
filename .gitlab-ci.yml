stages:
  - setup
  - validation
  - test
  - build
  - deploy

variables:
  DEV_IMAGE: "$ECR_URI:dev"
  PROD_IMAGE: "$ECR_URI:$CI_COMMIT_TAG"

default:
  tags:
    - backend
  image: node:20

install-dependencies:
  stage: setup
  script:
    - echo "Installation des dépendances"
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1h

scan-sensitive-informations:
  stage: validation
  image: alpine
  before_script:
    - apk add --no-cache git make bash
    - git clone https://github.com/awslabs/git-secrets.git
    - cd git-secrets && make install && cd ..
  script:
    - echo "Vérification des infos sensibles"
    - git secrets --scan

lint:
  stage: validation
  dependencies:
    - install-dependencies
  script:
    - echo "Analyse du code source"
    - npm run lint

test:
  stage: test
  dependencies:
    - install-dependencies
  script:
    - echo "Exécution des tests unitaires"
    - npm run test
  artifacts:
    paths:
      - test-results/test-report.xml
    reports:
      junit: test-results/test-report.xml

test-coverage:
  stage: test
  dependencies:
    - install-dependencies
  script:
    - echo "Analyse de la couverture de code"
    - npm run test:cov
  artifacts:
    paths:
      - coverage/

build:
  stage: build
  dependencies:
    - install-dependencies
  script:
    - echo "Compilation et construction de l'image docker"
    - gitlab-ci env.dev download --file .env
    - docker build -t $IMAGE_NAME .
    - docker tag $IMAGE_NAME $DEV_IMAGE
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URI
    - docker push $DEV_IMAGE
  only:
    - develop
  environment:
    name: Dev

deploy:
  stage: deploy
  before_script:
    - gitlab-ci trinity-dev-key-pair.pem download --file /tmp/trinity-dev-key.pem
    - chmod 600 /tmp/trinity-dev-key.pem
  script:
    - chmod +x deploy.sh
    - ./deploy.sh
  only:
    - develop
  environment:
    name: Dev
