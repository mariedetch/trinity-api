stages:
  - setup
  - validation
  - test
  - build
  - deploy

variables:
  DEV_IMAGE: "$ECR_URI:dev"
  PROD_IMAGE: "$ECR_URI:$CI_COMMIT_TAG"

default:
  tags:
    - backend
  image: node:20

install-dependencies:
  stage: setup
  script:
    - echo "Installation des dépendances"
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1h

scan-sensitive-informations:
  stage: validation
  image: alpine
  before_script:
    - apk add --no-cache git make bash
    - git clone https://github.com/awslabs/git-secrets.git
    - cd git-secrets && make install && cd ..
  script:
    - echo "Vérification des infos sensibles"
    - git secrets --scan

lint:
  stage: validation
  dependencies:
    - install-dependencies
  script:
    - echo "Analyse du code source"
    - npm run lint

test:
  stage: test
  dependencies:
    - install-dependencies
  script:
    - echo "Exécution des tests unitaires"
    - npm run test
  artifacts:
    paths:
      - test-results/test-report.xml
    reports:
      junit: test-results/test-report.xml
  after_script:
    - rm -rf test-results/

test-coverage:
  stage: test
  dependencies:
    - install-dependencies
  script:
    - echo "Analyse de la couverture de code"
    - npm run test:cov
  artifacts:
    paths:
      - coverage/

build:
  stage: build
  before_script:
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - cp .secure_files/env.$ENVIRONMENT .env
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URI
  script:
    - echo "Compilation et construction de l'image docker"
    - docker build -t $IMAGE_NAME .
    - docker tag $IMAGE_NAME $TARGET_IMAGE
    - docker push $TARGET_IMAGE
  after_script:
    - echo "Nettoyage des ressources après la construction de l'image Docker"
    - docker system prune -af --volumes
    - rm -rf .secure_files/ && rm -rf .env
  tags:
    - shell-executor
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
      variables:
        ENVIRONMENT: "dev"
        TARGET_IMAGE: $DEV_IMAGE
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always
      variables:
        ENVIRONMENT: "prod"
        TARGET_IMAGE: $PROD_IMAGE
    - when: never

deploy:
  stage: deploy
  before_script:
    - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_PUBLIC_IP >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
    - chmod 600 .secure_files/$DEPLOY_KEY
  script:
    - chmod +x deployment/application/$DEPLOY_SCRIPT
    - ./deployment/application/$DEPLOY_SCRIPT
  after_script:
    - echo "Nettoyage des clés SSH et fichiers de secrets"
    - rm -rf ~/.ssh/
    - rm -rf .secure_files/
  tags:
    - shell-executor
  environment:
    name: $ENVIRONMENT_NAME
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
      variables:
        ENVIRONMENT_NAME: "Dev"
        DEPLOY_KEY: "trinity-dev-key-pair.pem"
        DEPLOY_SCRIPT: "deploy-dev.sh"
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always
      variables:
        ENVIRONMENT_NAME: "Prod"
        DEPLOY_KEY: "trinity-prod-key-pair.pem"
        DEPLOY_SCRIPT: "deploy-prod.sh"
    - when: never
