stages:
  - validation
  - test
  - build
  - deploy

cache:
  paths:
    - node_modules/

before_script:
  - echo "Installation des dépendences"
  - npm install

scan-sensitive-informations:
  stage: validation
  tags:
    - frontend
  image: alpine
  before_script:
    - apk add --no-cache git make bash
    - git clone https://github.com/awslabs/git-secrets.git
    - cd git-secrets && make install && cd ..
  script:
    - echo "Vérification des infos sensibles"
    - git secrets --scan

lint:
  stage: validation
  tags:
    - frontend
  image: node:20
  script:
    - echo "Analyse du code source"
    - npm run lint

test:
  stage: test
  tags:
    - frontend
  image: node:20
  script:
    - echo "Exécution des tests unitaires"
    - npm run test
  artifacts:
    paths:
      - test-results/test-report.xml
    reports:
      junit: test-results/test-report.xml

test-coverage:
  stage: test
  tags:
    - frontend
  image: node:20
  script:
    - echo "Analyse de la couverture de code"
    - npm run test:coverage
  artifacts:
    paths:
      - coverage/

build:
  stage: build
  tags:
      - frontend
  image: node:20
  script:
    - echo "Compilation et construction du code source"
    - npm run build
  artifacts:
    paths:
      - dist/

deploy-development:
  stage: deploy
  tags:
    - frontend
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script: []
  script:
    - echo "Déploiement sur l'environnement de développement"
    - aws s3 sync dist/ s3://$AWS_BUCKET_NAME_DEV --delete
    - |
      INVALIDATION_ID=$(aws cloudfront create-invalidation \
        --distribution-id $AWS_CLOUDFRONT_DIST_ID_DEV \
        --paths "/*" \
        --query 'Invalidation.Id' --output text)
      echo "Cache invalidé avec l'ID : $INVALIDATION_ID"
  only:
    - develop
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID_DEV
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY_DEV
    AWS_DEFAULT_REGION: us-east-2
