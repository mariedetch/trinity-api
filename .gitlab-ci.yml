stages:
  - setup
  - validation
  - test
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pub-cache/
    - /sdks/flutter/bin/cache/
    - build/
    - coverage/

setup:
  stage: setup
  tags:
    - mobile-app
  image: ghcr.io/cirruslabs/flutter:3.24.5
  script:
    - echo "Configuration initiale"
    - flutter doctor
    - flutter pub get

scan-sensitive-informations:
  stage: validation
  tags:
    - mobile-app
  image: dart:stable
  before_script:
    - apt-get update && apt-get install -y git make bash
    - git clone https://github.com/awslabs/git-secrets.git
    - cd git-secrets && make install && cd ..
  script:
    - echo "Vérification des infos sensibles"
    - git secrets --scan
  except:
    - main

test:
  stage: test
  tags:
    - mobile-app
  image: ghcr.io/cirruslabs/flutter:3.24.5
  script:
    - echo "Exécution des tests unitaires"
    - flutter test
  except:
    - main

test-coverage:
  stage: test
  tags:
    - mobile-app
  image: ghcr.io/cirruslabs/flutter:3.24.5
  script:
    - echo "Analyse de la couverture de code"
    - flutter test --coverage
  artifacts:
    paths:
      - coverage/
  needs:
    - test
  except:
    - main

build:
  stage: build
  tags:
    - mobile-app
  image: ghcr.io/cirruslabs/flutter:3.24.5
  script:
    - echo "Compilation et construction de la version $CI_COMMIT_TAG"
    - flutter build apk --release
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
  only:
    - tags
    - /^v\d+\.\d+\.\d+$/

deploy:
  stage: deploy
  tags:
    - mobile-app
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script: []
  script:
    - echo "Déploiement de l'APK"
    - echo "Vérification que le fichier APK existe..."
    - aws s3 cp build/app/outputs/flutter-apk/app-release.apk s3://$AWS_BUCKET_NAME/trinity-app-$CI_COMMIT_TAG.apk
  only:
    - tags
    - /^v\d+\.\d+\.\d+$/
