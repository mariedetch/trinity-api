stages:
  - validation
  - test
  - build
  - deploy

cache:
  paths:
    - node_modules/

before_script:
  - echo "Installation des dépendences"
  - npm install

scan-sensitive-informations:
  stage: validation
  tags:
    - api
  image: alpine
  before_script:
    - apk add --no-cache git make bash
    - git clone https://github.com/awslabs/git-secrets.git
    - cd git-secrets && make install && cd ..
  script:
    - echo "Vérification des infos sensibles"
    - git secrets --scan

lint:
  stage: validation
  tags:
    - api
  image: node:20
  before_script: []
  script:
    - echo "Analyse du code source"
    - npm run lint

test:
  stage: test
  tags:
    - api
  image: node:20
  script:
    - echo "Exécution des tests unitaires"
    - npm run test
  artifacts:
    paths:
      - test-results/test-report.xml
    reports:
      junit: test-results/test-report.xml

test-coverage:
  stage: test
  tags:
    - api
  image: node:20
  script:
    - echo "Analyse de la couverture de code"
    - npm run test:cov
  artifacts:
    paths:
      - coverage/

build:
  stage: build
  tags:
      - api
  image: node:20
  script:
    - echo "Compilation et construction du code source"
    - npm run build
  artifacts:
    paths:
      - dist/
