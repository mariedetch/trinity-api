stages:
  - setup
  - validation
  - test
  - build
  - deploy

variables:
  DEV_IMAGE: "$ECR_URI:dev"
  PROD_IMAGE: "$ECR_URI:$CI_COMMIT_TAG"

install-dependencies:
  stage: setup
  image: node:20
  script:
    - echo "Installation des dépendances"
    - npm ci
  tags:
    - backend
  artifacts:
    paths:
      - node_modules/
    expire_in: 1h

build:
  stage: build
  dependencies:
    - install-dependencies
  before_script:
      - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
      - ls -lah .secure_files
  script:
    - echo "Compilation et construction de l'image docker"
    - cp .secure_files/env.dev .env
    - docker build -t $IMAGE_NAME .
    - docker tag $IMAGE_NAME $DEV_IMAGE
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URI
    - docker push $DEV_IMAGE
  tags:
    - shell-executor
  only:
    - develop
  environment:
    name: Dev

deploy:
  stage: deploy
  before_script:
      - curl -s https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer | bash
      - chmod 600 .secure_files/trinity-dev-key.pem
  script:
    - chmod +x deploy.sh
    - ./deploy.sh
  tags:
    - shell-executor
  only:
    - develop
  environment:
    name: Dev
